spring.application.name=Lifepath
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lifepath?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
# Development-only fallback. Set JWT_SECRET to a private random value outside local demos.
app.jwt.secret=${JWT_SECRET:lifepath-development-only-secret-change-before-deploy-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
